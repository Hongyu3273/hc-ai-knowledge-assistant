spring:
  application:
    name: ai-agent-hyc
  profiles:
    # Use the local profile by default; override with SPRING_PROFILES_ACTIVE=prod for deployments or CI.
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    # Select the auto-configured chat provider; app.assistant.model selects the KnowledgeAssistant default route.
    model:
      chat: dashscope
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: qwen3-14b-local:latest
    dashscope:
      # Provide real API keys in application-local.yml or through environment variables.
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          # qwen-turbo / qwen-plus / qwen-max
          model: qwen-plus
          temperature: 0.7
          top-p: 0.8

app:
  attachments:
    directory: ${CHAT_ATTACHMENT_DIR:${user.dir}/tmp/chat-attachments}
    max-file-bytes: 10485760
    max-pixels: 16000000
    max-per-message: 1
    max-context-bytes: 31457280
    allowed-types: [image/jpeg, image/png, image/webp]
  assistant:
    # Business route ID registered by AssistantModelConfiguration, independent of the chat provider setting above.
    # dashscope / gemini-2.5-pro / gemini-2.5-flash-lite
    model: ${ASSISTANT_MODEL:dashscope}
    # Logs user text and answers through MyLoggerAdvisor; keep off unless debugging locally.
    log-advisor:
      enabled: ${ASSISTANT_LOG_ADVISOR_ENABLED:false}
    rag:
      # Passages sent to the model per question.
      top-k: 5
      # 0 accepts every passage. Raise only after checking the retrieval evaluation report.
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.0}
      source-excerpt-chars: 200
      index:
        # Reuse the embedded index across restarts while documents and the embedding model are unchanged.
        persist: true
        directory: ${RAG_INDEX_DIR:${user.dir}/tmp/rag-index}
      cloud:
        # Creates the DashScope knowledge-base retriever and exposes POST /assistant/rag/cloud.
        enabled: ${RAG_CLOUD_ENABLED:false}
        index-name: ${RAG_CLOUD_INDEX_NAME:Interview Knowledge Base}
  gemini:
    # Enabling this adds both Gemini routes without replacing the DashScope chat provider.
    enabled: ${GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    pro-model: gemini-2.5-pro
    flash-lite-model: gemini-2.5-flash-lite
    timeout-ms: 120000
    # Input types exposed by this application; verify capabilities when changing the provider model.
    pro-inputs: [text, image]
    flash-lite-inputs: [text, image]
  chat-memory:
    directory: ${CHAT_MEMORY_DIR:${user.dir}/tmp/chat-memory}
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:10}

# LangChain4j + DashScope Qwen
# Documentation: https://docs.langchain4j.dev/integrations/language-models/dashscope/
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${AI_DASHSCOPE_API_KEY:}
        model-name: qwen-plus
        temperature: 0.7

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hc.aiagenthyc.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# Actuator: health and metrics under /api/actuator (custom meters are named hc.ai.*)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
# Logging levels
logging:
  level:
    com.hc.aiagenthyc.advisor.MyLoggerAdvisor: INFO
